<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>La Zizzola - Scheda accessibile</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
      font-size: 20px;
      line-height: 1.6;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px;
      padding-top: 92px;
    }
    .torna-mappa {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      background: #277DA1;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 900;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.22);
    }
    h1 {
      text-align: center;
      color: #277DA1;
      font-size: 2rem;
      margin: 12px 0;
      line-height: 1.2;
    }
    .foto-zizzola {
      width: 340px;
      max-width: 82%;
      height: auto;
      display: block;
      margin: 0 auto 22px;
      border-radius: 18px;
      border: 3px solid #c7d3e3;
      background: #f2f2f2;
    }
    .audio-box {
      margin: 18px 0;
      padding: 16px;
      background: #eef5ff;
      border: 3px solid #c7d3e3;
      border-radius: 18px;
      font-weight: 800;
    }
    .audio-buttons, .menu-buttons {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }
    button {
      min-height: 58px;
      padding: 12px 16px;
      border: 0;
      border-radius: 16px;
      background: #277DA1;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
    }
    .stop-button, .close-button { background: #F94144; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
      z-index: 2000;
      padding: 14px;
    }
    .modal-overlay.open { display: flex; }
    .modal-window {
      width: min(920px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #ffffff;
      border: 5px solid #277DA1;
      border-radius: 22px;
      padding: 18px;
    }
    .modal-window h2 {
      color: #277DA1;
      font-size: 1.45rem;
      margin: 0 0 14px;
      text-align: center;
      line-height: 1.25;
    }
    .descrizione-video {
      font-weight: 800;
      background: #f2f2f2;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 14px;
    }
    video, .modal-image {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      border: 3px solid #c7d3e3;
      background: #f2f2f2;
    }
    video { background: #000000; }
    .close-button {
      width: 100%;
      margin-top: 18px;
    }
    @media (min-width: 760px) {
      .menu-buttons { grid-template-columns: repeat(3, 1fr); }
      .audio-buttons { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      body { font-size: 18px; }
      main { padding: 12px; padding-top: 88px; }
      h1 { font-size: 1.7rem; }
      .foto-zizzola { width: 250px; }
      .modal-overlay { align-items: stretch; padding: 0; }
      .modal-window {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        max-height: 100vh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        padding: 12px;
      }
      .close-button {
        position: sticky;
        bottom: 0;
      }
    }
  </style>
</head>
<body>
  <a class="torna-mappa" href="javascript:history.back()">← Torna alla mappa</a>

  <main>
    <h1>La Zizzola</h1>

    <img class="foto-zizzola" src="fotozizzola.png" alt="Fotografia della Zizzola">

    <audio id="audioGuida" src="guidazizzola.mp3" preload="auto" autoplay></audio>

    <section class="audio-box" aria-label="Guida audio">
      <p>Guida audio della scheda.</p>
      <div class="audio-buttons">
        <button type="button" onclick="playGuida()">Ascolta guida audio</button>
        <button type="button" class="stop-button" onclick="stopGuida()">Stop guida audio</button>
      </div>
    </section>

    <nav class="menu-buttons" aria-label="Sezioni della scheda">
      <button type="button" onclick="openModal('modal-video')">Video LIS sottotitolato</button>
      <button type="button" onclick="openModal('modal-caa')">CAA</button>
      <button type="button" onclick="openModal('modal-testo')">Testo accessibile</button>
    </nav>
  </main>

  <div id="modal-video" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="titolo-video">
    <div class="modal-window">
      <h2 id="titolo-video">Video LIS sottotitolato</h2>
      <p class="descrizione-video">
        Il video include <strong>LIS</strong>, <strong>sottotitoli</strong> e <strong>audio in italiano</strong>.
      </p>
      <video controls preload="metadata">
        <source src="videozizzola.mp4" type="video/mp4">
        Il tuo browser non supporta il video.
      </video>
      <button type="button" class="close-button" onclick="closeModal('modal-video')">Chiudi</button>
    </div>
  </div>

  <div id="modal-caa" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="titolo-caa">
    <div class="modal-window">
      <h2 id="titolo-caa">CAA</h2>
      <img class="modal-image" src="caazizzola.png" alt="Scheda CAA della Zizzola">
      <button type="button" class="close-button" onclick="closeModal('modal-caa')">Chiudi</button>
    </div>
  </div>

  <div id="modal-testo" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="titolo-testo">
    <div class="modal-window">
      <h2 id="titolo-testo">Testo accessibile</h2>
      <img class="modal-image" src="testozizzola.png" alt="Testo accessibile sulla Zizzola">
      <button type="button" class="close-button" onclick="closeModal('modal-testo')">Chiudi</button>
    </div>
  </div>

  <script>
    const audioGuida = document.getElementById("audioGuida");

    function avviaGuidaAutomatica() {
      try {
        audioGuida.currentTime = 0;
        const tentativo = audioGuida.play();
        if (tentativo && typeof tentativo.catch === "function") {
          tentativo.catch(function () {});
        }
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", avviaGuidaAutomatica);
    window.addEventListener("load", avviaGuidaAutomatica);
    window.addEventListener("pageshow", avviaGuidaAutomatica);

    function playGuida() {
      try {
        audioGuida.currentTime = 0;
        audioGuida.play();
      } catch (e) {}
    }

    function stopGuida() {
      try {
        audioGuida.pause();
        audioGuida.currentTime = 0;
      } catch (e) {}
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add("open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove("open");

      if (id === "modal-video") {
        const video = modal.querySelector("video");
        if (video) video.pause();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        document.querySelectorAll(".modal-overlay.open").forEach(function(modal) {
          modal.classList.remove("open");
        });
      }
    });
  </script>
</body>
</html>
